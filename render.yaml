services:
  - type: web
    name: yemot-youtube-v34
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: AUDIO_MODE
        value: "fast"
      - key: GEMINI_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY2
        sync: false
      - key: YEMOT_TOKEN
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: APIFY_ACTOR
        value: "johnvc~youtube-download-api"
      - key: RAPIDAPI_KEY
        sync: false
      - key: RAPIDAPI_HOST
        value: "youtube-info-download-api.p.rapidapi.com"
      - key: RAPIDAPI_ENDPOINT
        value: "auto"
      - key: RAPIDAPI_KEY2
        sync: false
      - key: RAPIDAPI_HOST2
        sync: false
      - key: RAPIDAPI_ENDPOINT2
        value: "auto"
      - key: YT_COOKIES_B64
        sync: false
      - key: COBALT_API_URL
        sync: false
      - key: PROXY_URL
        sync: false
